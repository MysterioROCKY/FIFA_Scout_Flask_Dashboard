{% extends 'base.html' %}{% block title %}Compare · FIFA Scout{% endblock %}
{% block content %}<div class="container py-5"><p class="eyebrow">SIDE-BY-SIDE</p><h1>Compare players</h1><p class="text-secondary">Choose two players to compare their FIFA attributes.</p><div class="card-shell p-4 mb-4"><div class="row g-3"><div class="col-md-5"><label class="form-label">First player</label><select id="first" class="form-select">{% for player in players %}<option>{{ player.name }}</option>{% endfor %}</select></div><div class="col-md-5"><label class="form-label">Second player</label><select id="second" class="form-select">{% for player in players %}<option {% if loop.index == 2 %}selected{% endif %}>{{ player.name }}</option>{% endfor %}</select></div><div class="col-md-2 d-flex align-items-end"><button id="compareBtn" class="btn btn-accent w-100">Compare</button></div></div><p id="compareError" class="text-warning small mt-3 mb-0"></p></div><div class="row g-4"><div class="col-lg-7"><div class="chart-card"><canvas id="compareChart"></canvas></div></div><div class="col-lg-5"><div id="compareCards" class="row g-3"></div></div></div></div>
{% endblock %}{% block scripts %}<script>
const firstSelect=document.getElementById('first'),secondSelect=document.getElementById('second'),compareError=document.getElementById('compareError'),compareCards=document.getElementById('compareCards'),compareButton=document.getElementById('compareBtn');let compareChart; async function compare(){const u=new URLSearchParams({first:firstSelect.value,second:secondSelect.value});const r=await fetch('/api/compare?'+u);const d=await r.json();compareError.textContent=d.error||'';if(!r.ok)return;const labels=['Age','OVA','Potential','Value (€m)','Wage (€k)','Total stats'];const colors=['#47e6a1','#75a7ff'];if(compareChart)compareChart.destroy();compareChart=new Chart(document.querySelector('#compareChart'),{type:'radar',data:{labels,datasets:d.players.map((p,i)=>({label:p.name,data:[p.age,p.ova,p.pot,p.value_eur_m,p.wage_eur_k,p.total_stats],borderColor:colors[i],backgroundColor:colors[i]+'33'}))},options:{scales:{r:{ticks:{display:false},grid:{color:'#30445b'},angleLines:{color:'#30445b'},pointLabels:{color:'#dce8f4'}}},plugins:{legend:{labels:{color:'#fff'}}}}});compareCards.innerHTML=d.players.map(p=>`<div class="col-12"><article class="player-card"><h3>${p.name}</h3><p>${p.team} · Age ${p.age}</p><div class="d-flex justify-content-between"><span>OVA <b>${p.ova}</b></span><span>POT <b>${p.pot}</b></span><span>€${p.value_eur_m}m</span></div></article></div>`).join('')};compareButton.addEventListener('click',compare);compare();
</script>{% endblock %}
